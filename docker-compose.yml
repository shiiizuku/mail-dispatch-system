# Postgres for the mail dispatch system, on its own port (5434) so it never touches the DMS
# database on 5433. Data lives in the named volume and survives restarts.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mds
      POSTGRES_USER: mds
      POSTGRES_PASSWORD: mds
    ports: ['127.0.0.1:5434:5432']
    volumes:
      - mds-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mds -d mds']
      interval: 5s
      retries: 10

volumes:
  mds-postgres:
